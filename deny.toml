# cargo-deny configuration for the PS3EYE ETS2 Headtracker.
# Run with: cargo deny check

[graph]
all-features = false

[licenses]
version = 2
# The project itself is GPL-2.0-only (see README: the OV534/OV772x register
# tables and the packet scanner are derived from the Linux kernel gspca-ov534
# driver). Everything else in the dependency tree must be permissive.
allow = [
    "GPL-2.0-only",            # this crate
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
